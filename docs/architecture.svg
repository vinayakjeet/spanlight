<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Spanlight data flow, as built</title>
  <desc>Host code calls the span helpers. A head sampler decides once per session, before any span records. Detectors run inside the span helper while the span is still writable, then the batch processor exports to Tempo and the metric reader to Prometheus.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="660" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="600" fill="#0f172a">Spanlight data flow, as built</text>
  <text x="24" y="55" font-size="12.5" fill="#64748b">Two places differ from the SPEC drawing, and both are load bearing. They are marked below.</text>

  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="24" y1="72" x2="956" y2="72"/>
  </g>

  <!-- In process -->
  <rect x="24" y="90" width="470" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="112" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.6">IN THE HOST PROCESS</text>

  <rect x="44" y="126" width="200" height="58" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="149" font-size="13" font-weight="600" fill="#312e81">Host code</text>
  <text x="60" y="167" font-size="11.5" fill="#4338ca">ShipGate, llm/client.py, demo agent</text>

  <rect x="44" y="206" width="200" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="229" font-size="13" font-weight="600" fill="#0f172a">Span helpers</text>
  <text x="60" y="247" font-size="11.5" fill="#475569">session, model_span,</text>
  <text x="60" y="263" font-size="11.5" fill="#475569">tool_span, retrieval_span</text>

  <rect x="44" y="300" width="200" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="60" y="323" font-size="13" font-weight="600" fill="#7c2d12">Head sampler</text>
  <text x="60" y="341" font-size="11.5" fill="#9a3412">ParentBased(TraceIdRatio)</text>
  <text x="60" y="357" font-size="11.5" fill="#9a3412">one decision per session</text>

  <rect x="278" y="206" width="196" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="294" y="229" font-size="13" font-weight="600" fill="#0f172a">Detector registry</text>
  <text x="294" y="248" font-size="11.5" fill="#475569">runs in the span's finally,</text>
  <text x="294" y="264" font-size="11.5" fill="#475569">while it is still writable</text>
  <line x1="294" y1="278" x2="458" y2="278" stroke="#e2e8f0"/>
  <text x="294" y="297" font-size="11.5" fill="#334155">loop</text>
  <text x="294" y="315" font-size="11.5" fill="#334155">cost_ceiling</text>
  <text x="294" y="333" font-size="11.5" fill="#334155">silent_tool_failure</text>
  <text x="294" y="354" font-size="11" fill="#94a3b8">sets attribute + event on the span</text>

  <!-- arrows in process -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 144 184 L 144 204"/>
    <path d="M 144 278 L 144 298"/>
    <path d="M 244 236 L 276 236"/>
  </g>
  <text x="152" y="199" font-size="11" fill="#64748b">opens a span</text>
  <text x="152" y="293" font-size="11" fill="#64748b">at span start</text>
  <text x="250" y="228" font-size="11" fill="#64748b">at span end</text>

  <!-- dropped path -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowMuted)">
    <path d="M 244 333 L 340 333 L 340 368"/>
  </g>
  <text x="250" y="327" font-size="11" fill="#94a3b8">sampled out: NonRecordingSpan,</text>
  <text x="250" y="384" font-size="11" fill="#94a3b8">detectors never run, nothing is counted</text>

  <!-- Export -->
  <rect x="524" y="90" width="200" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="540" y="112" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.6">EXPORT</text>

  <rect x="544" y="132" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="155" font-size="13" font-weight="600" fill="#0f172a">Batch processor</text>
  <text x="560" y="173" font-size="11.5" fill="#475569">CountedExporter wraps</text>
  <text x="560" y="189" font-size="11.5" fill="#475569">the OTLP exporter</text>

  <rect x="544" y="228" width="160" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="251" font-size="13" font-weight="600" fill="#0f172a">Metric reader</text>
  <text x="560" y="269" font-size="11.5" fill="#475569">detections_total</text>
  <text x="560" y="285" font-size="11.5" fill="#475569">session_cost_usd</text>
  <text x="560" y="301" font-size="11.5" fill="#475569">token_usage, export_failures</text>

  <rect x="544" y="340" width="160" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="560" y="363" font-size="13" font-weight="600" fill="#14532d">JsonlSink</text>
  <text x="560" y="381" font-size="11.5" fill="#166534">study/collect.py only</text>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 474 250 L 542 178"/>
    <path d="M 474 286 L 542 268"/>
    <path d="M 474 320 L 542 360"/>
  </g>

  <!-- Backends -->
  <rect x="754" y="90" width="202" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="770" y="112" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.6">GRAFANA CLOUD FREE</text>

  <rect x="774" y="132" width="162" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="790" y="155" font-size="13" font-weight="600" fill="#1e3a8a">Tempo</text>
  <text x="790" y="173" font-size="11.5" fill="#1d4ed8">traces, 14 day retention</text>

  <rect x="774" y="228" width="162" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="790" y="251" font-size="13" font-weight="600" fill="#1e3a8a">Prometheus</text>
  <text x="790" y="269" font-size="11.5" fill="#1d4ed8">metrics</text>

  <rect x="774" y="340" width="162" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="790" y="363" font-size="13" font-weight="600" fill="#14532d">corpus.jsonl</text>
  <text x="790" y="381" font-size="11.5" fill="#166534">500 sessions, on disk</text>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 706 165 L 772 165"/>
    <path d="M 706 270 L 772 262"/>
    <path d="M 706 371 L 772 371"/>
  </g>
  <text x="712" y="158" font-size="11" fill="#64748b">OTLP/HTTP</text>
  <text x="712" y="256" font-size="11" fill="#64748b">OTLP/HTTP</text>

  <!-- Consumers -->
  <rect x="24" y="448" width="932" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="470" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.6">WHAT READS IT</text>

  <rect x="44" y="484" width="200" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="507" font-size="13" font-weight="600" fill="#0f172a">Fleet dashboard</text>
  <text x="60" y="525" font-size="11.5" fill="#475569">cost, detections, latency</text>

  <rect x="268" y="484" width="200" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="284" y="507" font-size="13" font-weight="600" fill="#0f172a">Session dashboard</text>
  <text x="284" y="525" font-size="11.5" fill="#475569">paste a session id</text>

  <rect x="492" y="484" width="200" height="62" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="508" y="507" font-size="13" font-weight="600" fill="#7f1d1d">Alert rule</text>
  <text x="508" y="525" font-size="11.5" fill="#b91c1c">increase(detections_total)</text>

  <rect x="716" y="484" width="220" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="732" y="507" font-size="13" font-weight="600" fill="#14532d">Field study and gate</text>
  <text x="732" y="525" font-size="11.5" fill="#166534">analyse.py, detector_gate.py</text>

  <g stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arrowMuted)">
    <path d="M 830 402 L 830 482"/>
    <path d="M 855 194 L 890 210 L 890 440 L 300 440 L 190 440 L 144 482"/>
    <path d="M 855 290 L 870 300 L 870 430 L 368 430 L 368 482"/>
    <path d="M 855 290 L 862 320 L 862 460 L 592 460 L 592 482"/>
  </g>

  <!-- Notes -->
  <text x="24" y="600" font-size="12" font-weight="600" fill="#0f172a">Where this differs from the SPEC drawing</text>
  <text x="24" y="620" font-size="11.5" fill="#475569">1. Detectors are not a SpanProcessor. on_end hands out a ReadableSpan with no set_attribute, so a detection could never land on the span that caused it.</text>
  <text x="24" y="638" font-size="11.5" fill="#475569">2. The sampler runs before the detectors, not after. It decides at span start, so a dropped session is never seen by a detector and never counted.</text>
  <text x="24" y="656" font-size="11.5" fill="#475569">3. The corpus is written straight to disk. Tempo has 14 day retention and no bulk export, so a corpus that lived only there could not be re-analysed.</text>
</svg>
